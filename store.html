<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" href="img/favicon.ico" />	
    <title>金門街鹹粥蔥抓餅</title>
    <link rel="stylesheet" type="text/css" href="cssjs/indicator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css?family=Noto+Sans+TC:300,400,500,600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins','Noto Sans TC', 微軟正黑體,  sans-serif;    
    }
    p{
        font-weight: 300;
        color: #111;
    }
    .banner{
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url(imgs/bg.jpg);
        background-size: cover;
        background-position: center;
    }
    .banner .content{
        max-width: 900px;
        text-align: center;
    }
    .banner .content h2{
        font-size: 5.5em;
        color: #111;
        font-weight: 900;
    }
    /* .banner .content p{
        font-size: 1em;
        color: #111;
    } */
    .btn{
        font-size: 1em;
        color: #fff;
        background: #454545;
        display: inline-block;
        padding: 10px 30px;
        margin-top: 20px;
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 2px;
        transition: .5s;
    }
    .btn:hover{
        letter-spacing: 6px;
    }
    header{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 40px 100px;
        z-index: 10000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: .5s;
    }
    header.sticky{
        background: #fff;
        padding: 10px 100px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }
    header .logo{
        color: #111;
        font-weight: 700;
        font-size: 2em;
        text-decoration: none;
    }
    header.sticky .logo{
        color: #011056;
    }
    header .logo span{
        color: #ff0157;
    }
    header .navigation{
        position: relative;
        display: flex;
    }
    header .navigation li{
        list-style: none;
        margin-left: 30px;
    }
    header .navigation li a{
        text-decoration: none;
        color: #333;
        font-weight: 300;
    }
    header.sticky .navigation li a{
        color: #111;
    }
    header .navigation li a:hover{
        color: #ff0157;
    }
    
    .title{
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .menu .content{
        display: flex;
        justify-content: center;
        /* flex-direction: row-reverse; */
        flex-wrap: wrap;
        margin-top: 40px;
    }
    .menu .content .box{
        width: 340px;
        margin: 20px;
        border: 15px solid #fff;
        box-shadow: 0 5px 30px rgba(0,0,0,0.08);
    }
    .menu .content .box .imgBx{
        position: relative;
        width: 100%;
        height: 300px;
    }
    .menu .content .box .imgBx img{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .menu .content .box .nine::before{
        line-height: 1.5;
        text-align: center;
        content: '加蛋\A加九層塔';
        white-space: pre-line;
        position: absolute;
        top: 20px;
        left: 50%;  
        transform: translateX(-50%);      
        width: 100px;
        height: 100px;
        background: url("imgs/w.jpg") no-repeat center / cover;
        z-index: 10;
        border: 2px solid #eee;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eee;
        font-weight: 500;
        font-size: 1.2em;
    }
    .menu .content .box .white::before{
        line-height: 1.5;
        text-align: center;
        content: '加蛋\A加小白菜';
        white-space: pre-line;
        position: absolute;
        top: 20px;
        left: 50%;  
        transform: translateX(-50%);      
        width: 100px;
        height: 100px;
        background: url("imgs/w.jpg") no-repeat center / cover;
        z-index: 10;
        border: 2px solid #eee;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #eee;
        font-weight: 500;
        font-size: 1.2em;
    }
    .menu .content .box .text{
        padding: 15px 0 5px;
    }
    .menu .content .box .text{
        display: flex;
        justify-content: space-between;
    }
    .menu .content .box .text h3{
        font-weight: 400;
        color: #111;
    }
</style>
</head>
<body>
    <header>
        <a href="#" class="logo">金門街鹹粥蔥抓餅</a>
        <ul class="navigation">
            <li><a href="#banner">首頁</a></li>
            <li><a href="#Menu">菜單</a></li>
            <li><a href="#time">營業時間</a></li>
            <li><a href="#contact">地點</a></li>
        </ul>
    </header>
    <section class="banner" id="banner">
        <div class="content">
            <h2>金門街鹹粥蔥抓餅</h2>
            <!-- <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Voluptatum pariatur id perspiciatis! Illo dicta minus similique debitis facere, distinctio soluta rem ex aspernatur atque amet accusamus a quae ea fuga, maiores mollitia asperiores. Saepe obcaecati, impedit rerum tempora debitis voluptas. Laborum porro minima natus debitis hic unde, non itaque explicabo, quo, ullam sint laboriosam iusto commodi id! Necessitatibus quia corporis doloremque ullam atque quidem fuga, quaerat ut? Optio atque maiores modi, laudantium, aliquid dolores cumque repellat porro autem necessitatibus est.</p> -->
            <a href="#" class="btn">菜單</a>
        </div>        
    </section>

    <section class="menu" id="menu">
        <div class="title">
            <h2 class="titleText">菜單</h2>
            <!-- <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Architecto, magni.</p> -->
        </div>
        <div class="content">
            <div class="box">
                <div class="imgBx">
                    <img src="imgs/menu01.jpg" alt="">
                </div>
                <div class="text">
                    <h3>鹹粥 (大)</h3>
                    <p>$65</p>
                </div>
            </div>
            <div class="box">
                <div class="imgBx">
                    <img src="imgs/menu02.jpg" alt="">
                </div>
                <div class="text">
                    <h3>鹹粥 (小)</h3>
                    <p>$50</p>
                </div>
            </div>
        </div>
        <div class="content">
            <div class="box">
                <div class="imgBx">
                    <img src="imgs/menu03.jpg" alt="">
                </div>
                <div class="text">
                    <h3>蔥抓餅</h3>
                    <p>$30</p>
                </div>
            </div>
            <div class="box">
                <div class="imgBx">
                    <img src="imgs/menu04.jpg" alt="">
                </div>
                <div class="text">
                    <h3>蔥抓餅加蛋</h3>
                    <p>$40</p>
                </div>
            </div>
            <div class="box">
                <div class="imgBx nine">
                    <img src="imgs/menu05.jpg" alt="">
                </div>
                <div class="text">
                    <h3>蔥抓餅加蛋加九層塔</h3>
                    <p>$45</p>
                </div>
            </div>
            <div class="box">
                <div class="imgBx white">
                    <img src="imgs/menu05.jpg" alt="">
                </div>
                
                <div class="text">
                    <h3>蔥抓餅加蛋加小白菜</h3>
                    <p>$45</p>
                </div>
            </div>
            <div class="content">
                <div class="box">
                    <div class="imgBx">
                        <img src="imgs/menu06.jpg" alt="">
                    </div>
                    <div class="text">
                        <h3>黑豆漿</h3>
                        <p>$25</p>
                    </div>
                </div>
                <div class="box">
                    <div class="imgBx">
                        <img src="imgs/menu07.jpg" alt="">
                    </div>
                    <div class="text">
                        <h3>紅茶</h3>
                        <p>$10</p>
                    </div>
                </div>
                <div class="box">
                    <div class="imgBx">
                        <img src="imgs/menu08.jpg" alt="">
                    </div>
                    <div class="text">
                        <h3>奶茶</h3>
                        <p>$15</p>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <script>
        window.addEventListener('scroll', function(){
            const header = document.querySelector('header');
            header.classList.toggle("sticky", window.scrollY > 0)
        });
    </script>


</body>
</html>
